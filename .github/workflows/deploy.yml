name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scoped to what the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-flight run finish rather than
# cancelling it (a half-published Pages deploy is worse than a queued one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `npm install` (not `npm ci`) so the Linux runner can reconcile the
        # platform-specific optional native deps (@tailwindcss/oxide /
        # @napi-rs/wasm-runtime → @emnapi/*) that a macOS-generated lockfile
        # can't fully pin. `npm ci`'s strict pre-check rejects that drift.
        run: npm install --no-audit --no-fund

      - name: Build static export
        # GITHUB_ACTIONS=true is set by the runner, so next.config.ts applies the
        # /Eqty basePath here and emits ./out.
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
